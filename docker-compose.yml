services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      Coach__Endpoint: ${COACH_ENDPOINT:-}
      Coach__ApiKey: ${COACH_API_KEY:-}
      Coach__Deployment: ${COACH_DEPLOYMENT:-}
      Seed: "true"
      Logging__LogLevel__Microsoft.AspNetCore: ${LOG_REQUESTS:-Warning}
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: ${LOG_SQL:-Warning}
    volumes:
      - challenge-data:/data

volumes:
  challenge-data:
